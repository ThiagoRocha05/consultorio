<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Consultório das Doutoras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --doc:#7c5cff; --doc-l:#efeaff; --ink:#22314a; --bg1:#e6f7ff; --bg2:#fdf0ff;
  --ok:#21b26b; --bad:#ff4d5e; --card:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow-x:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:none}
input{font-family:inherit}
.screen{display:none;min-height:100vh;padding:18px 22px 28px;animation:pop .35s ease}
.screen.active{display:block}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.topbar h2{margin:0;font-size:clamp(22px,3.2vw,32px);flex:1}
.iconbtn{width:54px;height:54px;border-radius:18px;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.08);display:grid;place-items:center;font-size:26px;font-weight:700;color:var(--ink)}
.iconbtn:active{transform:translateY(3px);box-shadow:none}
.big{font-size:clamp(20px,2.6vw,28px);font-weight:600;padding:16px 30px;border-radius:24px;background:var(--doc);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.big.alt{background:#fff;color:var(--doc)}
.big:disabled{opacity:.45}

/* HOME */
#home h1{text-align:center;font-size:clamp(30px,5vw,54px);margin:10px 0 2px;color:#3a2a8a}
#home p.sub{text-align:center;margin:0 0 22px;font-size:clamp(17px,2.2vw,24px);opacity:.75}
.docs{display:flex;gap:26px;justify-content:center;flex-wrap:wrap}
.doccard{background:#fff;border-radius:34px;padding:18px 18px 22px;width:min(42vw,330px);min-width:250px;box-shadow:0 10px 0 rgba(0,0,0,.07);text-align:center;transition:transform .15s;border:5px solid transparent}
.doccard:active{transform:scale(.96)}
.doccard svg{width:100%;height:auto}
.doccard .nm{font-size:clamp(24px,3vw,34px);font-weight:700;margin-top:6px}
.doccard .ct{font-size:17px;opacity:.7;margin-top:2px}

/* FICHA */
.paper{background:#fff;border-radius:30px;padding:22px 26px;box-shadow:0 10px 0 rgba(0,0,0,.06);max-width:900px;margin:0 auto;position:relative}
.paper:before{content:"";position:absolute;left:0;top:0;right:0;height:14px;border-radius:30px 30px 0 0;background:var(--doc)}
.label{font-size:clamp(19px,2.3vw,25px);font-weight:600;margin:16px 0 8px}
.choices{display:flex;gap:14px;flex-wrap:wrap}
.choice{flex:1;min-width:140px;background:var(--doc-l);border-radius:24px;padding:12px;font-size:clamp(19px,2.3vw,25px);font-weight:600;color:var(--ink);border:4px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px}
.choice svg{width:86px;height:86px}
#queixaCh .choice{min-width:120px}
#queixaCh .choice svg{width:60px;height:60px}
.choice.sel{border-color:var(--doc);background:#fff;box-shadow:0 0 0 4px var(--doc-l)}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.txt{flex:1;min-width:220px;font-size:clamp(22px,2.8vw,30px);padding:14px 18px;border-radius:20px;border:4px solid var(--doc-l);outline:none;color:var(--ink);font-weight:600}
.txt:focus{border-color:var(--doc)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:66px;height:66px;border-radius:22px;background:var(--doc);color:#fff;font-size:38px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.stepper button:active{transform:translateY(4px);box-shadow:none}
.agev{font-size:44px;font-weight:700;min-width:90px;text-align:center}
.agev small{display:block;font-size:16px;font-weight:500;opacity:.6;margin-top:-6px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.hidden{display:none!important}

/* CONSULTA */
.consult{display:grid;grid-template-columns:minmax(260px,38%) 1fr;gap:20px;align-items:start}
@media (max-width:760px){.consult{grid-template-columns:1fr}}
.pcard{background:#fff;border-radius:30px;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.06)}
.pcard .av{background:var(--doc-l);border-radius:24px;display:grid;place-items:center;padding:6px}
.pcard .av svg{width:100%;max-height:260px}
.pname{font-size:clamp(24px,3vw,32px);font-weight:700;margin:10px 0 0}
.pinfo{opacity:.7;font-size:18px}
.bubble{position:relative;background:#fff7d6;border-radius:20px;padding:12px 14px 12px 14px;margin-top:12px;font-size:19px;line-height:1.3;display:flex;gap:10px;align-items:flex-start}
.bubble button{flex:none;width:44px;height:44px;border-radius:14px;background:#ffd84d;font-size:20px}
.notes{margin-top:14px}
.notes h3{margin:0 0 6px;font-size:20px}
.notes ul{list-style:none;padding:0;margin:0}
.notes li{background:var(--doc-l);border-radius:14px;padding:8px 12px;margin-bottom:6px;font-size:17px}
.notes li b.bad{color:var(--bad)} .notes li b.ok{color:var(--ok)}
.notes .empty{opacity:.55;font-size:16px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tool{background:#fff;border-radius:28px;padding:14px 10px 16px;box-shadow:0 8px 0 rgba(0,0,0,.07);text-align:center;font-size:clamp(19px,2.3vw,25px);font-weight:600;color:var(--ink);position:relative;border:4px solid transparent}
.tool:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.07)}
.tool svg{width:min(120px,60%);height:auto;display:block;margin:0 auto 4px}
.tool.done{border-color:var(--ok)}
.tool.done:after{content:"✓";position:absolute;top:10px;right:14px;background:var(--ok);color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.tool.locked{opacity:.5}
.tool .lk{display:block;font-size:14px;font-weight:500;opacity:.8}
.diagbtn{width:100%;margin-top:18px}

/* OVERLAY */
#overlay{position:fixed;inset:0;background:rgba(20,25,45,.6);display:none;z-index:50;padding:16px;overflow:auto}
#overlay.on{display:grid;place-items:center}
.panel{background:#fff;border-radius:30px;width:min(980px,100%);padding:16px 18px 20px;position:relative;animation:pop .3s}
.panel .ph{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.panel .ph h2{flex:1;margin:0;font-size:clamp(22px,3vw,30px)}
.result{margin-top:12px;font-size:clamp(20px,2.6vw,28px);font-weight:600;text-align:center;min-height:40px}
.result .bad{color:var(--bad)} .result .ok{color:var(--ok)}
.center{text-align:center}

/* XRAY */
.xray{background:radial-gradient(ellipse at center,#12324a,#050d16 75%);border-radius:24px;position:relative;overflow:hidden;display:flex;justify-content:center;padding:10px}
.xray:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(80,200,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(80,200,255,.07) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.xray svg{height:min(56vh,520px);max-width:100%;position:relative}
.xray.cam{min-height:min(56vh,520px)}
.xray .bn{fill:#e9fbff;stroke:#bdf1ff;stroke-width:1}
.xray .rib{fill:none;stroke:#e9fbff;stroke-width:4;stroke-linecap:round}
.xray .hole{fill:#0a1a28}
.xray .thin{stroke:#0a1a28;stroke-width:1.5;fill:none}
.xray .boneln{stroke:#e9fbff;stroke-linecap:round}
.xray .sil{fill:rgba(110,210,255,.16);stroke:rgba(140,225,255,.35);stroke-width:2}
.xray .silln{stroke:rgba(110,210,255,.16);stroke-linecap:round;fill:none}
.xcam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter 2.6s}
.xray.xon .xcam{filter:grayscale(1) invert(1) contrast(1.6) brightness(.7)}
.xtint{position:absolute;inset:0;background:#1d8fd8;mix-blend-mode:color;opacity:0;transition:opacity 2.6s;pointer-events:none}
.xray.xon .xtint{opacity:.85}
.xray.cam #xsil{display:none}
.xtag{position:absolute;left:14px;top:12px;color:#8fe4ff;font-size:16px;letter-spacing:1px;font-weight:500}
.redbtn{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#e8112d 60%,#a3001a);color:#fff;font-size:22px;font-weight:700;box-shadow:0 8px 0 #7a0014,0 0 0 8px #ffe1e5;margin:14px auto 0;display:block}
.redbtn:active{transform:translateY(6px);box-shadow:0 2px 0 #7a0014,0 0 0 8px #ffe1e5}
.redbtn:disabled{filter:grayscale(.6);opacity:.7}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

/* THERMO */
.camview{position:relative;border-radius:24px;overflow:hidden;background:#cfe9f7;height:min(52vh,460px);display:grid;place-items:center}
.camview video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.camview .face{height:92%;position:relative}
.camview .face svg{height:100%;width:auto}
.cross{position:absolute;left:50%;top:38%;width:110px;height:110px;transform:translate(-50%,-50%);pointer-events:none}
.laser{position:absolute;left:50%;top:38%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle,#fff 0 20%,#ff1f3d 45%,rgba(255,0,40,0) 70%);display:none}
.laser.on{display:block;animation:pulse .3s infinite}
.hud{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.45);color:#fff;border-radius:14px;padding:6px 12px;font-size:17px}
.gun{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap}
.lcd{background:#cfe8c8;border:6px solid #2f3b4a;border-radius:16px;font-family:'Courier New',monospace;font-weight:700;font-size:46px;padding:4px 18px;min-width:210px;text-align:center;color:#1b2a1b}
.lcd.hot{background:#ffc9cf;color:#8a0016}
.lcd.okc{background:#c9f5d9}
.camtoggle{background:#fff;border:3px solid var(--doc);color:var(--doc);border-radius:16px;padding:10px 14px;font-size:17px;font-weight:600}

/* PRESSURE */
.bpwrap{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.bpwrap svg{max-width:100%}
#cuff{transform-box:fill-box;transform-origin:center;transition:transform .2s}

/* STETHO */
.stwrap{display:flex;justify-content:center;background:var(--doc-l);border-radius:24px;padding:8px}
.stwrap svg{height:min(52vh,460px);max-width:100%}
.spot{cursor:pointer}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(12deg)}}
.spot circle.ring{fill:rgba(255,255,255,.55);stroke:var(--doc);stroke-width:5;stroke-dasharray:10 7;animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.beat{animation:beat .6s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
.beat,.wob{transform-box:fill-box;transform-origin:center}
.wob{animation:wob .5s infinite}
@keyframes wob{25%{transform:translateX(-3px) scale(1.05)}75%{transform:translateX(3px) scale(1.05)}}

/* DIAG & RX */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.opt{background:#fff;border-radius:26px;padding:12px;box-shadow:0 7px 0 rgba(0,0,0,.07);font-size:clamp(18px,2.2vw,23px);font-weight:600;color:var(--ink);text-align:center;border:4px solid transparent;line-height:1.15}
.opt svg{width:90px;height:90px;display:block;margin:0 auto 4px}
.opt.sel{border-color:var(--doc);box-shadow:0 0 0 5px var(--doc-l),0 7px 0 rgba(0,0,0,.07)}
.opt:active{transform:translateY(3px)}
.sug{position:absolute;top:8px;left:8px;background:#ffd43b;color:#5a4300;border-radius:10px;padding:2px 8px;font-size:14px}
.msg{margin:14px auto 0;max-width:820px;background:#fff7d6;border-radius:20px;padding:12px 16px;font-size:20px;text-align:center}
.msg.hidden{display:none}
.receita{max-width:760px;margin:0 auto;background:#fffef8;border-radius:12px;padding:26px 30px 30px;box-shadow:0 12px 30px rgba(0,0,0,.12);position:relative;background-image:repeating-linear-gradient(transparent 0 37px,#e6eefc 37px 38px);animation:pop .5s}
.rxhead{display:flex;align-items:center;gap:14px;border-bottom:4px solid var(--doc);padding-bottom:10px;margin-bottom:12px}
.rxhead svg{width:64px;height:64px;flex:none}
.rxhead h2{margin:0;font-size:clamp(22px,3vw,30px);color:var(--doc)}
.rxhead div small{font-size:16px;opacity:.7}
.rxline{font-size:20px;margin:6px 0}
.rxitem{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.8);border-radius:16px;padding:6px 10px;margin:8px 0}
.rxitem svg{width:56px;height:56px;flex:none}
.rxitem b{font-size:20px}
.rxitem div{font-size:17px}
.sign{font-family:'Dancing Script',cursive;font-size:40px;color:#1e3a8a;text-align:right;margin-top:18px;border-top:2px solid #9aa;display:inline-block;float:right;padding:0 10px}
.stamp{position:absolute;left:40px;bottom:14px;border:5px solid var(--doc);color:var(--doc);border-radius:50%;width:120px;height:120px;display:grid;place-items:center;text-align:center;font-weight:700;font-size:15px;transform:rotate(-14deg);opacity:.75;line-height:1.1;animation:stamp .5s .4s both}
@keyframes stamp{from{transform:rotate(-14deg) scale(2.5);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:.75}}
.clear{clear:both}
.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.sndbtn.off{opacity:.45}
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen active">
  <div class="topbar"><div style="flex:1"></div><button class="iconbtn sndbtn" onclick="toggleSound()" aria-label="Som">🔊</button></div>
  <h1>Consultório das Doutoras</h1>
  <p class="sub">Quem vai atender hoje?</p>
  <div class="docs">
    <button class="doccard" onclick="pickDoctor('helena')" id="dc-helena"></button>
    <button class="doccard" onclick="pickDoctor('valentina')" id="dc-valentina"></button>
  </div>
</section>

<!-- FICHA / PRONTUARIO -->
<section id="ficha" class="screen">
  <div class="topbar"><button class="iconbtn" onclick="go('home')" aria-label="Voltar">←</button><h2 id="fichaTitle">Prontuário</h2><button class="iconbtn sndbtn" onclick="toggleSound()">🔊</button></div>
  <div class="paper">
    <div class="label">Quem é o paciente?</div>
    <div class="choices" id="kindCh">
      <button class="choice" data-v="pessoa" onclick="setKind('pessoa')"><span id="icoPessoa"></span>Pessoa</button>
      <button class="choice" data-v="pet" onclick="setKind('pet')"><span id="icoPet"></span>Bichinho</button>
    </div>
    <div id="speciesBox" class="hidden">
      <div class="label">Que bichinho?</div>
      <div class="choices" id="specCh">
        <button class="choice" data-v="cachorro" onclick="setSpecies('cachorro')"><span id="icoDog"></span>Cachorro</button>
        <button class="choice" data-v="gato" onclick="setSpecies('gato')"><span id="icoCat"></span>Gato</button>
      </div>
    </div>
    <div id="restBox" class="hidden">
      <div class="label" id="sexLabel">É menina ou menino?</div>
      <div class="choices" id="sexCh">
        <button class="choice" data-v="f" onclick="setSex('f')" id="sexF">Menina</button>
        <button class="choice" data-v="m" onclick="setSex('m')" id="sexM">Menino</button>
      </div>
      <div class="label">Nome do paciente</div>
      <div class="row">
        <input id="pName" class="txt" maxlength="22" placeholder="Digite o nome" autocomplete="off">
        <button class="iconbtn" onclick="randomName()" aria-label="Sortear nome" title="Sortear nome">🎲</button>
      </div>
      <div class="label">Idade</div>
      <div class="stepper">
        <button onclick="stepAge(-1)">−</button>
        <input id="pAge" class="txt" type="number" inputmode="numeric" style="max-width:130px;text-align:center;font-size:38px" value="8" oninput="ageTyped()">
        <button onclick="stepAge(1)">+</button>
        <span id="ageUnit" style="font-size:24px;font-weight:600">anos</span>
      </div>
      <div class="label">O que o paciente está sentindo?</div>
      <div class="choices" id="queixaCh"></div>
      <div class="actions"><button class="big" onclick="startConsult()">Começar a consulta</button></div>
    </div>
  </div>
</section>

<!-- CONSULTA -->
<section id="consulta" class="screen">
  <div class="topbar"><button class="iconbtn" onclick="go('ficha')" aria-label="Voltar">←</button><h2 id="consTitle">Consulta</h2><button class="iconbtn sndbtn" onclick="toggleSound()">🔊</button></div>
  <div class="consult">
    <div class="pcard">
      <div class="av" id="pAvatar"></div>
      <div class="pname" id="pNameShow"></div>
      <div class="pinfo" id="pInfoShow"></div>
      <div class="bubble"><button onclick="say(S.p.complaint)" aria-label="Ouvir">🔈</button><span id="pComplaint"></span></div>
      <div class="notes"><h3>Anotações do prontuário</h3><ul id="notes"></ul></div>
    </div>
    <div>
      <div class="tools" id="tools"></div>
      <button class="big diagbtn" onclick="openDiag()">Dar o diagnóstico</button>
    </div>
  </div>
</section>

<!-- DIAGNOSTICO -->
<section id="diag" class="screen">
  <div class="topbar"><button class="iconbtn" onclick="go('consulta')" aria-label="Voltar">←</button><h2>O que o paciente tem?</h2><button class="iconbtn sndbtn" onclick="toggleSound()">🔊</button></div>
  <div class="grid" id="diagGrid"></div>
  <div class="msg hidden" id="diagMsg"></div>
</section>

<!-- PRESCRICAO -->
<section id="rx" class="screen">
  <div class="topbar"><button class="iconbtn" onclick="go('diag')" aria-label="Voltar">←</button><h2 id="rxTitle">Escolha os remédios</h2><button class="iconbtn sndbtn" onclick="toggleSound()">🔊</button></div>
  <div class="grid" id="rxGrid"></div>
  <div class="msg hidden" id="rxMsg"></div>
  <div class="actions"><button class="big" onclick="signRx()">Assinar a receita</button></div>
</section>

<!-- RECEITA -->
<section id="receita" class="screen">
  <div class="receita" id="receitaBox"></div>
  <div class="actions">
    <button class="big" onclick="newPatient()">Próximo paciente</button>
    <button class="big alt" onclick="go('home')">Trocar de doutora</button>
  </div>
</section>

<div id="overlay"><div class="panel" id="panel"></div></div>
<canvas id="confetti"></canvas>

<script>
/* ============ ESTADO ============ */
const DOCS={
  helena:{id:'helena',name:'Dra. Helena',color:'#7c5cff',light:'#efeaff',coat2:'#b9a8ff',hair:'#5a3825',acc:'#ffd23f'},
  valentina:{id:'valentina',name:'Dra. Valentina',color:'#ff4f8b',light:'#ffe8f0',coat2:'#ffb3cd',hair:'#5a3825',acc:'#3fd2c7'}
};
const S={doc:null,sound:true,form:{kind:null,species:null,sex:null},p:null,done:{},notes:[],diag:null,rxSel:new Set()};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>n.toFixed(1).replace('.',',');

function store(){try{return JSON.parse(localStorage.getItem('consultorio-contagem')||'{}')}catch(e){return {}}}
function bump(id){try{const c=store();c[id]=(c[id]||0)+1;localStorage.setItem('consultorio-contagem',JSON.stringify(c))}catch(e){}}

function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
  window.scrollTo(0,0);
  if(id==='home')renderHome();
  stopAudio();
}

/* ============ SOM E VOZ ============ */
let AC=null,live=[];
function ac(){if(!S.sound)return null;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){return null}return AC}
function tone(f,d,type='sine',v=.15,t0=0,f2){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();const t=a.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05);live.push(o)}
function stopAudio(){live.forEach(o=>{try{o.stop()}catch(e){}});live=[];clearInterval(window._hb)}

function noise(dur,freq,q,vol,t0=0,type='lowpass',f2){const a=ac();if(!a)return;const src=a.createBufferSource();src.buffer=noiseBuf(a);src.loop=true;const fl=a.createBiquadFilter();fl.type=type;const t=a.currentTime+t0;fl.frequency.setValueAtTime(freq,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.02,dur/4));g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(fl).connect(g).connect(a.destination);src.start(t);src.stop(t+dur+.05);live.push(src)}

function bellySound(sick){

    const st=a.currentTime+t;o.type='sine';o.frequency.setValueAtTime(f,st);o.frequency.exponentialRampToValueAtTime(f*rnd(.6,1.6),st+d);

    o.connect(fl).connect(g).connect(a.destination);o.start(st);lfo.start(st);o.stop(st+d+.05);lfo.stop(st+d+.05);live.push(o,lfo);

  const tail=dog?[[306,102],[322,92],[336,80],[348,66],[356,52]]:[[306,104],[322,104],[338,100],[352,90],[364,76],[372,60],[376,44],[374,30]];

  const legs=(o,op)=>{let t=`<g opacity="${op}" transform="translate(${o} 0)">`;
    t+=bone(140,120,132,170,7)+bone(132,172,138,218,5)+`<path class="bn" d="M132 222 h20 l4 10 h-26Z"/>`;

    return t+'</g>'};
  s+=legs(14,.45);
  // escapula e bacia
  s+=`<path class="bn" d="M128 92 L156 96 L148 128 L132 124Z"/>`;
  s+=`<path class="bn" d="M276 96 L312 100 L304 122 L284 120Z"/><circle cx="292" cy="112" r="6" class="hole"/>`;
  // coluna
  for(let i=0;i<17;i++){const x=128+i*11,y=96-Math.sin(i/16*Math.PI)*9;s+=`<circle cx="${x}" cy="${y}" r="5.4" class="bn"/>`}
  // costelas
  for(let i=0;i<8;i++){const x=152+i*12,len=72-Math.abs(i-2)*6;s+=`<path class="rib" d="M${x} 92 C${x-8} ${92+len*.4} ${x-6} ${92+len*.8} ${x+6} ${92+len}"/>`}
  s+=legs(0,1);
  // pescoco
  for(let i=0;i<4;i++)s+=`<circle cx="${104+i*7}" cy="${90+i*1.5}" r="4.6" class="bn"/>`;
  // cranio
  let skull= dog?`<path class="bn" d="M30 96 C30 78 56 66 80 66 C100 66 112 80 108 96 C104 108 88 112 72 110 L32 106Z"/>
     <circle cx="80" cy="84" r="8" class="hole"/><path class="bn" d="M34 106 L74 112 L70 120 L38 116Z"/>
     <path class="thin" d="M40 107 v6 M48 108 v6 M56 109 v6 M64 110 v6"/><ellipse cx="36" cy="96" rx="3" ry="2" class="hole"/>`
   :`<path class="bn" d="M50 92 C50 64 76 56 94 62 C112 68 114 92 104 104 C96 112 76 114 64 110 L50 104Z"/>
     <circle cx="84" cy="82" r="11" class="hole"/><path class="bn" d="M52 104 L80 112 L76 118 L54 112Z"/>
     <path class="thin" d="M58 106 v6 M64 108 v6 M70 109 v6"/>`;
  s+=`<g transform="translate(104 92) scale(${hs}) translate(-104 -92)">${skull}</g>`;
  return `<g transform="translate(200 236) scale(${k}) translate(-200 -236)">${s}</g>`;
}

function pickDoctor(id){
  click();S.doc=DOCS[id];
  document.documentElement.style.setProperty('--doc',S.doc.color);

/* ============ FICHA ============ */
function newPatient(){
  S.form={kind:null,species:null,sex:null,queixa:null};
  $('#pName').value='';$('#pAge').value=8;
  $('#fichaTitle').textContent='Prontuário da '+S.doc.name;
  refreshFicha();go('ficha');
}
function setSel(box,v){document.querySelectorAll(box+' .choice').forEach(b=>b.classList.toggle('sel',b.dataset.v===v))}
function setKind(k){click();S.form.kind=k;S.form.species=null;if(k==='pet'){$('#pAge').value=3}else{$('#pAge').value=8}refreshFicha();
  if(k==='pet')say('Que bichinho é?');else say('É menina ou menino?');}
function setSpecies(s){click();S.form.species=s;refreshFicha();say(s==='cachorro'?'Um cachorrinho! É fêmea ou macho?':'Um gatinho! É fêmea ou macho?')}
function setSex(x){click();S.form.sex=x;refreshFicha();say('Qual é o nome do paciente?');setTimeout(()=>$('#pName').focus(),200)}
function refreshFicha(){
  const f=S.form;setSel('#kindCh',f.kind);setSel('#specCh',f.species);setSel('#sexCh',f.sex);
  $('#speciesBox').classList.toggle('hidden',f.kind!=='pet');
  $('#restBox').classList.toggle('hidden',!(f.kind==='pessoa'||(f.kind==='pet'&&f.species)));
  const age=+$('#pAge').value||0;
  if(f.kind==='pet'){$('#sexLabel').textContent='É fêmea ou macho?';$('#sexF').textContent='Fêmea';$('#sexM').textContent='Macho';}
  else if(age<13){$('#sexLabel').textContent='É menina ou menino?';$('#sexF').textContent='Menina';$('#sexM').textContent='Menino';}
  else{$('#sexLabel').textContent='É mulher ou homem?';$('#sexF').textContent='Mulher';$('#sexM').textContent='Homem';}
  $('#ageUnit').textContent=age===1?'ano':'anos';
  renderQueixas();
}

/* ============ CASO CLINICO ============ */
function makeCase(p){
  const pet=p.kind==='pet';
  let opts=pet?['febre','fratura','barriga','saudavel']:['febre','fratura','barriga','saudavel'];
  if(!pet&&p.age>=30)opts.push('pressao','pressao');
  p.mystery=!S.form.queixa||S.form.queixa==='misterio';
  p.cond=p.mystery?pick(opts):S.form.queixa;
  // temperatura
  if(pet) p.temp=p.cond==='febre'?rnd(39.8,40.6):rnd(38.3,39.0);
  else p.temp=p.cond==='febre'?rnd(38.3,39.6):rnd(36.1,36.9);
  // pressao
  p.bp=p.cond==='pressao'?[pick([15,16,17]),pick([10,11])]:[pick([11,12]),pick([7,8])];
  // batimentos
  let base=pet?(p.species==='cachorro'?100:160):(p.age<13?95:p.age>=65?70:76);
  if(p.cond==='febre')base+=pet?20:18;
  p.bpm=Math.round(base+rnd(-4,4));
  const o=p.sex==='f'?'a':'o', O=p.sex==='f'?'A':'O', nm=p.name;
  const C={pessoa:{
      febre:'Doutora, estou com o corpo quentinho e muito cansad'+o+'.',
      fratura:'Ai, ai! Caí da bicicleta e meu braço está doendo muito!',
      pressao:'Doutora, estou com dor de cabeça e meio tont'+o+'.',
      barriga:'Doutora, minha barriga está doendo e fazendo barulho!',
      saudavel:'Oi, doutora! Vim só fazer um check-up.'},
    pet:{
      febre:`${O} ${nm} está quietinh${o}, sem vontade de brincar e com o focinho quente.`,
      fratura:`${O} ${nm} pulou do sofá e está mancando da patinha da frente.`,
      barriga:`${O} ${nm} comeu uma coisa estranha no quintal e está com dor de barriga.`,
      saudavel:`${O} ${nm} está ótim${o}! Veio fazer um check-up e tomar a vacina do ano.`}};
  if(p.mystery){p.complaint=pet?`${pet?(p.species==='cachorro'?'Au au! ':'Miau! '):''}O dono não sabe o que ${p.sex==='f'?'ela':'ele'} tem. Vamos examinar!`:'Doutora, não sei o que eu tenho. Pode me examinar?';return}
  p.complaint=(pet?(p.species==='cachorro'?'Au au! ':'Miau! ')+'O dono conta: ':'')+C[p.kind][p.cond];
}

async function xrayCam(auto){

function runXray(){
  const p=S.p,pet=p.kind==='pet',H=pet?260:440;
  $('#xbtn').disabled=true;$('#xres').innerHTML='<span class="pulse">Escaneando...</span>';
  $('#xcr').setAttribute('height',0);$('#xfr').setAttribute('opacity',0);
  const xb=$('#xbox');xb.classList.remove('xon');void xb.offsetWidth;xb.classList.add('xon');
  const a=ac();if(a){tone(90,2.8,'sawtooth',.05);tone(400,2.8,'sine',.04,0,1200)}
  const bar=$('#xbar');bar.setAttribute('opacity',1);
  const t0=performance.now(),D=2800;
  const step=now=>{const t=Math.min(1,(now-t0)/D);const y=t*H;
    $('#xcr').setAttribute('height',y);bar.setAttribute('y',y-40);

async function camOn(sel){

function runThermo(){

  const lcd=$('#lcd');lcd.className='lcd';

  window._ti=setInterval(()=>{i++;v+=inc;lcd.textContent=fmt(i>=steps?target:v)+' °C';tone(1500+i*20,.03,'square',.04);
    if(i>=steps){clearInterval(window._ti);finish()}},90);
  function finish(){

    if(fever){$('#tres').innerHTML=`<span class="bad">${fmt(target)} °C: está com febre!</span><div style="font-size:17px;font-weight:500;margin-top:4px">${ref}</div>`;
      say(`${fmt(target)} graus. Está com febre!`);addNote('thermo',`Temperatura: <b class="bad">${fmt(target)} °C, febre</b>`)}
    else{$('#tres').innerHTML=`<span class="ok">${fmt(target)} °C: temperatura normal!</span><div style="font-size:17px;font-weight:500;margin-top:4px">${ref}</div>`;

  }

      <g id="cuff"><rect x="90" y="66" width="130" height="84" rx="14" fill="#4c6ef5"/><path d="M100 80 h110 M100 136 h110" stroke="#91a7ff" stroke-width="4" stroke-dasharray="6 6"/></g>

      <circle cx="100" cy="100" r="96" fill="#fff" stroke="#556" stroke-width="6"/>${ticks}
      <g id="needle" style="transform-origin:100px 100px;transform:rotate(-225deg)"><line x1="100" y1="100" x2="178" y2="100" stroke="#e8112d" stroke-width="5" stroke-linecap="round"/></g>
      <circle cx="100" cy="100" r="9" fill="#334"/>
      <path id="bpheart" d="M100 156 C86 146 90 134 100 140 C110 134 114 146 100 156Z" fill="#ddd"/>
    </svg>
   </div>
   <div class="center"><div class="lcd" id="bplcd" style="display:inline-block;margin-top:8px">-- por --</div></div>
   <button class="redbtn" id="bpbtn" onclick="runBP()">MEDIR</button>
   <div class="result" id="bpres">Aperte MEDIR para encher o aparelho.</div>`);
  say('Coloque o aparelho no braço e aperte medir!');

function runBP(){
  const p=S.p,[sy,di]=p.bp;$('#bpbtn').disabled=true;$('#bpres').textContent='Enchendo...';$('#bplcd').className='lcd';$('#bplcd').textContent='-- por --';
  const nd=$('#needle'),cuff=$('#cuff'),heart=$('#bpheart');
  const ang=v=>-225+v*9; // v em "cmHg" 0..30
  let t0=performance.now();const up=1600,down=2600;
  const step=now=>{const e=now-t0;let v;
    if(e<up){v=(e/up)*(sy+5);cuff.style.transform=`scale(1,${1+e/up*.18})`;if(Math.random()<.2)tone(200,.05,'sine',.06)}
    else if(e<up+down){const k=(e-up)/down;v=(sy+5)-(k*(sy+5-di+2));cuff.style.transform=`scale(1,${1.18-k*.14})`;
      const inBeat=v<=sy&&v>=di;heart.setAttribute('fill',inBeat&&Math.floor(e/350)%2?'#ff4d6d':'#ddd');
      if(inBeat&&Math.floor(e/350)!==Math.floor((e-16)/350))tone(70,.12,'sine',.25)}
    else{v=0;}
    nd.style.transform=`rotate(${ang(v)}deg)`;
    if(e<up+down)window._raf=requestAnimationFrame(step);else fin()};
  window._raf=requestAnimationFrame(step);
  function fin(){
    cuff.style.transform='';heart.setAttribute('fill','#ff4d6d');$('#bpbtn').disabled=false;
    const high=p.cond==='pressao';$('#bplcd').textContent=`${sy} por ${di}`;$('#bplcd').classList.add(high?'hot':'okc');
    tone(high?600:1800,.4,'square',.07);
    if(high){$('#bpres').innerHTML=`<span class="bad">${sy} por ${di}: a pressão está alta!</span>`;say(`${sy} por ${di}. A pressão está alta!`);addNote('bp',`Pressão: <b class="bad">${sy} por ${di}, alta</b>`)}
    else{$('#bpres').innerHTML=`<span class="ok">${sy} por ${di}: pressão normal!</span>`;say(`${sy} por ${di}. Pressão normal!`);addNote('bp',`Pressão: <b class="ok">${sy} por ${di}, normal</b>`)}
  }
}

  const p=S.p;
  openPanel('Estetoscópio',`<div class="stwrap" id="stw">${avatar(p,{spots:true,sad:p.cond!=='saudavel'})}</div>
   <div class="result" id="stres">Toque no coração ou na barriga para escutar.</div>`);
  say('Toque no coração ou na barriga para escutar!');
}
function listen(where){
  stopAudio();const p=S.p;const a=ac();
  if(where==='heart'){
    const iv=60/p.bpm;
    if(a){stethoNoise(6.5);const beat=()=>heartBeat();beat();window._hb=setInterval(beat,iv*1000);setTimeout(()=>clearInterval(window._hb),6500)}
    const fast=p.cond==='febre';
    $('#stres').innerHTML=`${p.bpm} batidas por minuto: `+(fast?`<span class="bad">o coração está acelerado!</span>`:`<span class="ok">o coração está batendo certinho!</span>`);
    say(fast?'Tum tum tum! O coração está acelerado.':'Tum tum! O coração está batendo certinho.');
    addNote('heart',`Coração: ${p.bpm} batidas por minuto, `+(fast?'<b class="bad">acelerado</b>':'<b class="ok">normal</b>'));
  }else{
    const sick=p.cond==='barriga';
    document.querySelectorAll('#stw [data-spot="belly"]').forEach(g=>g.classList.toggle('wob',sick));
    if(a){stethoNoise(sick?5:3);bellySound(sick)}
    $('#stres').innerHTML=sick?`<span class="bad">Grrrrooonc! A barriga está fazendo muito barulho!</span>`:`<span class="ok">A barriga está calminha.</span>`;
    say(sick?'Grrrrooonc! A barriga está fazendo muito barulho!':'A barriga está calminha.');
    addNote('belly','Barriga: '+(sick?'<b class="bad">muito barulho, dolorida</b>':'<b class="ok">calminha</b>'));
  }
  if(S.done.heart&&S.done.belly)S.done.stetho=true;renderTools();
}

/* ============ DIAGNOSTICO ============ */
function openDiag(){
  click();const p=S.p;
  const list=DIAGS[p.kind].filter(d=>!d.min30||p.age>=30);
  $('#diagGrid').innerHTML=list.map(d=>`<button class="opt" onclick="chooseDiag('${d.id}')">${d.ic}${d.name}</button>`).join('');
  $('#diagMsg').classList.add('hidden');go('diag');
  say('O que '+(p.sex==='f'?'a ':'o ')+p.name+' tem?');
}
function chooseDiag(id){
  const p=S.p;
  tada();S.diag=id;S.rxSel=new Set();
  const d=DIAGS[p.kind].find(x=>x.id===id);
  $('#rxTitle').textContent='Remédios para: '+d.name;
  $('#rxGrid').innerHTML=MEDS[p.kind].map(m=>`<button class="opt" data-id="${m.id}" onclick="toggleMed('${m.id}')" style="position:relative">${CURE[p.kind][id].includes(m.id)?'<span class="sug">★ combina</span>':''}${m.ic}${m.name}</button>`).join('');
  $('#rxMsg').classList.add('hidden');go('rx');
  say('Agora escolha os remédios. Os que têm estrelinha combinam com esse diagnóstico.');
}
function toggleMed(id){click();if(S.rxSel.has(id))S.rxSel.delete(id);else S.rxSel.add(id);
  document.querySelectorAll('#rxGrid .opt').forEach(b=>b.classList.toggle('sel',S.rxSel.has(b.dataset.id)))}
function signRx(){
  const p=S.p,ok=CURE[p.kind][S.diag],bonus=BONUS[p.kind],m=$('#rxMsg');
  const sel=[...S.rxSel];
  if(!sel.length){oops();m.classList.remove('hidden');m.textContent='Escolha pelo menos um remédio!';say(m.textContent);return}
  showReceita(sel);
}

/* ============ RECEITA ============ */
function showReceita(sel){
  const p=S.p,d=S.doc,dg=DIAGS[p.kind].find(x=>x.id===S.diag);
  const logo=p.kind==='pet'?`<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="${d.color}"/><ellipse cx="32" cy="40" rx="11" ry="9" fill="#fff"/><circle cx="19" cy="27" r="5" fill="#fff"/><circle cx="27" cy="19" r="5" fill="#fff"/><circle cx="37" cy="19" r="5" fill="#fff"/><circle cx="45" cy="27" r="5" fill="#fff"/></svg>`
    :`<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="${d.color}"/><path d="M32 16 v32 M16 32 h32" stroke="#fff" stroke-width="10" stroke-linecap="round"/></svg>`;
  const items=sel.map(id=>MEDS[p.kind].find(m=>m.id===id)).map(m=>`<div class="rxitem">${m.ic}<div><b>${m.name}</b><div>${m.txt}</div></div></div>`).join('');
  const hoje=new Date().toLocaleDateString('pt-BR');
  $('#receitaBox').innerHTML=`
   <div class="rxhead">${logo}<div><h2>${p.kind==='pet'?'Clínica Veterinária':'Consultório'} da ${d.name}</h2><small>Receita • ${hoje}</small></div></div>
   <div class="rxline"><b>Paciente:</b> ${esc(p.name)} (${p.kind==='pet'?(p.species==='cachorro'?'cachorro':'gato')+', ':''}${sexWord(p)}, ${p.age} ${p.age===1?'ano':'anos'})</div>
   <div class="rxline"><b>Diagnóstico:</b> ${dg.name}</div>
   <div class="rxline" style="margin-top:12px"><b>Tratamento:</b></div>
   ${items}
   <div class="rxline" style="margin-top:12px">Volte logo para contar se melhorou!</div>
   <div class="sign">${d.name}</div><div class="clear"></div>
   <div class="stamp">${d.name.toUpperCase()}<br>★ CRM ★<br>KIDS</div>`;
  bump(d.id);go('receita');tada();confetti();
  setTimeout(()=>say(`Receita pronta! ${p.name} vai ficar ${S.diag==='saudavel'?'protegid'+(p.sex==='f'?'a':'o'):'bo'+(p.sex==='f'?'a':'m')} rapidinho. Muito bem, ${d.name.replace('Dra.','doutora')}!`),300);
}

/* ============ CONFETE ============ */
function confetti(){
  const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=[S.doc.color,'#ffd43b','#69db7c','#4dabf7','#ff8787'];
  const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:rnd(-2,2),vy:rnd(2,6),r:rnd(5,10),a:rnd(0,6),c:pick(cols)}));
  const t0=performance.now();
  (function f(now){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(now-t0<3500)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})(t0);
}

if('speechSynthesis' in window){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}}
renderHome();
</script>
